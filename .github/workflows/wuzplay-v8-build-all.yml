name: Wuzplay v8 all-in-one DFU

on:
  push:
    branches: [main, wuzplay-cyberdeck-v8-reconstruction, wuzplay-v8-no-amiibo-folder]
    paths:
      - 'wuzplay-cyberdeck-v8/firmware/source/**'
      - '.github/workflows/wuzplay-v8-build-all.yml'
  pull_request:
    paths:
      - 'wuzplay-cyberdeck-v8/firmware/source/**'
      - '.github/workflows/wuzplay-v8-build-all.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lcd:
    runs-on: ubuntu-latest
    container: solosky/nrf52-sdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact full custom source snapshot
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/solosky/pixl.js.git pixljs-source
          cd pixljs-source
          git fetch origin refs/pull/457/head:refs/remotes/origin/wuzplay-custom-pr457
          git checkout refs/remotes/origin/wuzplay-custom-pr457
          test "$(git rev-parse HEAD)" = "74a505a948a1cfedd296b0033239f74b4090c420"
          git submodule update --init --recursive

      - name: Apply Wuzplay v8 all-in-one feature patch
        run: |
          python3 wuzplay-cyberdeck-v8/firmware/source/apply_wuzplay_v8.py pixljs-source
          python3 wuzplay-cyberdeck-v8/firmware/source/add_arcade_theme.py pixljs-source
          python3 wuzplay-cyberdeck-v8/firmware/source/force_all_apps.py pixljs-source
          python3 wuzplay-cyberdeck-v8/firmware/source/force_screen_rotation.py pixljs-source

      - name: Static feature gate
        run: |
          set -eu
          test ! -d pixljs-source/fw/application/src/app/amiibo
          test ! -d pixljs-source/fw/application/src/app/amiidb
          test ! -d pixljs-source/fw/application/src/app/amiibolink
          ! grep -q '$(PROJ_DIR)/app/amiibo' pixljs-source/fw/application/Makefile
          ! grep -q '$(PROJ_DIR)/app/amiidb' pixljs-source/fw/application/Makefile
          ! grep -q '$(PROJ_DIR)/app/amiibolink' pixljs-source/fw/application/Makefile
          ! grep -q 'app_amiibo_info' pixljs-source/fw/application/src/core/mini_app_data.c
          ! grep -q 'app_amiidb_info' pixljs-source/fw/application/src/core/mini_app_data.c
          ! grep -q 'app_amiibolink_info' pixljs-source/fw/application/src/core/mini_app_data.c
          grep -q 'app_nfc_actions_info' pixljs-source/fw/application/src/core/mini_app_data.c
          grep -q 'NFC Actions' pixljs-source/fw/application/src/app/nfc_actions/app_nfc_actions.c
          grep -q 'Govee%20On' pixljs-source/fw/application/src/app/nfc_actions/app_nfc_actions.c
          grep -q 'CyberSync&mode=system' pixljs-source/fw/application/src/app/nfc_actions/app_nfc_actions.c
          grep -q 'cyber_hoops_2k_run' pixljs-source/fw/application/src/app/game/scene/game_scene_game_list.c
          grep -q 'cyber_fighter_run' pixljs-source/fw/application/src/app/game/scene/game_scene_game_list.c
          grep -q 'u8g2_font_likeminecraft_te' pixljs-source/fw/application/src/mui/view/mui_list_view.c
          grep -q -- '-DAPP_GAME_ENABLE' pixljs-source/fw/application/Makefile
          grep -q -- '-DAPP_PLAYER_ENABLE' pixljs-source/fw/application/Makefile
          ! grep -q -- '-DAPP_LEGLAMIIBO_ENABLE' pixljs-source/fw/application/Makefile
          grep -q 'return_key_enabled' pixljs-source/fw/application/src/mod/settings.h
          grep -q 'display_flip' pixljs-source/fw/application/src/mod/settings.h
          grep -q '(void)flipped; return U8G2_R2;' pixljs-source/fw/application/src/mui/mui_u8g2.c

      - name: Build LCD firmware and Nordic DFU
        run: cd pixljs-source/fw && make all BOARD=LCD RELEASE=1 APP_VERSION=802

      - name: Verify linked ELF symbols
        run: |
          set -eu
          NM=arm-none-eabi-nm
          ELF=pixljs-source/fw/_build/pixljs.out
          for symbol in \
            app_nfc_actions_info app_chameleon_info app_player_info app_game_info app_ble_info \
            tiny_arkanoid_run tiny_invaders_run tiny_lander_run tiny_tris_run \
            cyber_hoops_2k_run cyber_fighter_run; do
            $NM "$ELF" | grep -q " $symbol$"
          done
          ! $NM "$ELF" | grep -q ' app_amiibo_info$'
          ! $NM "$ELF" | grep -q ' app_amiidb_info$'
          ! $NM "$ELF" | grep -q ' app_amiibolink_info$'

      - name: Verify compiled binary features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          b = Path('pixljs-source/fw/_build/pixljs.bin').read_bytes()
          required = [
              b'NFC Actions', b'NFC Cards', b'Media Player', b'Cyber Arcade', b'Wireless Files',
              b'Arkanoid', b'Invaders', b'Lander', b'Tris', b'Cyber Hoops 2K', b'Cyber Fighter',
              b'scriptable:///run?scriptName=CyberSync&mode=system',
              b'scriptable:///run?scriptName=CyberSync&mode=dashboard',
              b'scriptable:///run?scriptName=CyberSync&mode=network',
              b'scriptable:///run?scriptName=CyberSync&mode=tools',
              b'scriptable:///run?scriptName=CyberSync&mode=alerts',
              b'scriptable:///run?scriptName=CyberSync&mode=all',
              b'scriptable:///run?scriptName=WuzSync',
              b'shortcuts://run-shortcut?name=Govee%20On',
              b'shortcuts://run-shortcut?name=Govee%20Off',
              b'shortcuts://run-shortcut?name=Govee%20Bright',
              b'shortcuts://run-shortcut?name=Govee%20Relax',
              b'shortcuts://run-shortcut?name=Govee%20Movie',
              b'shortcuts://run-shortcut?name=Govee%20Red',
              b'shortcuts://run-shortcut?name=Govee%20Blue',
              b'shortcuts://run-shortcut?name=Drive%20Home',
              b'shortcuts://run-shortcut?name=Find%20Car',
              b'shortcuts://run-shortcut?name=Flashlight',
              b'shortcuts://run-shortcut?name=Quick%20Note',
              b'shortcuts://run-shortcut?name=10%20Minute%20Timer',
          ]
          missing = [x.decode() for x in required if x not in b]
          if missing:
              raise SystemExit('compiled feature verification failed: ' + repr(missing))
          forbidden = [b'Amiibo Database', b'AmiiboLink']
          found = [x.decode() for x in forbidden if x in b]
          if found:
              raise SystemExit('forbidden Amiibo app labels present in binary: ' + repr(found))
          zpath = Path('pixljs-source/fw/_build/pixjs_ota_v802.zip')
          with zipfile.ZipFile(zpath) as z:
              names = set(z.namelist())
              if not {'manifest.json','pixljs.bin','pixljs.dat'} <= names:
                  raise SystemExit('Nordic DFU members missing: ' + repr(names))
              if z.testzip() is not None:
                  raise SystemExit('DFU zip CRC test failed')
          print('compiled feature verification: PASS')
          PY

      - name: Prepare installable DFU
        run: |
          cp pixljs-source/fw/_build/pixjs_ota_v802.zip 01_INSTALL_WUZPLAY_V8_ALL_IN_ONE_ROT2_DFU_KEEP_ZIPPED.zip
          sha256sum 01_INSTALL_WUZPLAY_V8_ALL_IN_ONE_ROT2_DFU_KEEP_ZIPPED.zip > WUZPLAY_V8_ALL_IN_ONE_ROT2_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WUZPLAY_V8_ALL_IN_ONE_ROT2_DFU
          if-no-files-found: error
          path: |
            01_INSTALL_WUZPLAY_V8_ALL_IN_ONE_ROT2_DFU_KEEP_ZIPPED.zip
            WUZPLAY_V8_ALL_IN_ONE_ROT2_SHA256.txt
            pixljs-source/fw/_build/pixljs.bin
            pixljs-source/fw/_build/pixljs_all.hex
