; BLINK Pocket Desktop — NM-TV-154
; Board: ESP32-D0WD-V3, 4MB flash, ST7789 240x240 (see hardware/NM-TV-154/pinmap.md)
; Phase 1 step 3: minimal display test only. No PSRAM on this board.

[env:nmtv154]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM10
monitor_port = COM10
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@2.5.1

; Pulls firmware/core/ (FaceMotion, CompanionInputs -- already unit-tested,
; see firmware/core/FaceMotion_TESTED.md) into the build as a local library
; instead of duplicating those files into src/. CompanionInputs compiles
; along with it but stays uncalled until this board has an IMU.
lib_extra_dirs = firmware

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_BL=19
    -D TFT_BACKLIGHT_ON=LOW
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
; TFT_RST and TFT_MISO intentionally omitted: not wired on this board (see pinmap.md)
